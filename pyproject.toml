[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "highvisor"
version = "0.0.1"
description = "A local supervisor for the desktop UI layer: observe and control native apps over a small, brain-agnostic RPC."
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "DazzlingDukeOfLazers" }]
license = { text = "MIT" }
dependencies = [
    "pillow>=9",
    "uiautomation>=2.0 ; sys_platform == 'win32'",
]

[project.scripts]
hv = "highvisor.cli:main"
hvd = "highvisor.server:main"

[tool.setuptools.packages.find]
include = ["highvisor*"]
