<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>highvisor</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <header>
    <span class="logo">highvisor</span>
    <span id="self" class="muted">…</span>
    <span class="spacer"></span>
    <span id="backend" class="badge">backend: …</span>
    <span id="stalemsg" class="stalemsg" hidden>⟳ restart daemon</span>
    <span id="conn" class="dot" title="event stream">●</span>
    <button id="off" class="off" title="shut down the highvisor daemon">⏻</button>
  </header>

  <main>
    <section class="col left">
      <div class="panel">
        <div class="panel-hd">windows <button id="refresh" title="refresh">⟳</button></div>
        <ul id="windows" class="list"></ul>
      </div>
      <div class="panel">
        <div class="panel-hd">layout</div>
        <div class="layout">
          <div class="layout-row">
            <select id="layoutsel"></select>
            <button id="applylayout">apply</button>
          </div>
          <div class="layout-row">
            <input id="savename" placeholder="save current as…">
            <button id="savelayout" title="snapshot current window positions">save</button>
          </div>
          <div class="layout-row">
            <button id="usertest" class="full"
                    title="reposition + resize for user testing: Raves → upper-right, Caves of Qud → lower-right, 1920×1080 each">
              ⊞ user test · Raves ▲ / Qud ▼ @ 1920×1080</button>
          </div>
          <div id="uttest-status" class="uttest-status muted"></div>
          <div id="layoutdesc" class="muted"></div>
        </div>
      </div>
      <div class="panel">
        <div class="panel-hd">peers</div>
        <ul id="peers" class="list"><li class="muted">no bridge / no peers</li></ul>
      </div>
    </section>

    <div class="gutter" data-resize="left" title="drag to resize columns"></div>

    <section class="col mid">
      <div class="panel resizable">
        <div class="panel-hd">pending — agent loop (gated) <span id="lanes" class="muted"></span></div>
        <div id="pending" class="pending"><div class="muted">nothing pending</div></div>
      </div>
      <div class="hgutter" data-resize="pending" title="drag to resize pending / preview"></div>
      <div class="panel grow">
        <div class="panel-hd">preview <span id="shotlabel" class="muted"></span></div>
        <div id="shotwrap" class="shotwrap"><span class="muted">click a window to capture</span></div>
      </div>
      <div class="panel">
        <div class="panel-hd">context handoff <span class="muted">→ peers</span></div>
        <div class="handoff">
          <textarea id="ctx" placeholder="type or paste context to send to the other machine…"></textarea>
          <button id="send">send</button>
        </div>
      </div>
    </section>

    <div class="gutter" data-resize="mid" title="drag to resize columns"></div>

    <section class="col right">
      <div class="panel grow">
        <div class="panel-hd">log <button id="clearlog" title="clear">clear</button></div>
        <div id="log" class="log"></div>
      </div>
    </section>
  </main>

  <div id="downmsg">highvisor stopped — restart it from a terminal, then reload.</div>
  <script src="/app.js"></script>
</body>
</html>
